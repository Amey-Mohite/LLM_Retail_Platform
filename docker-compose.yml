# Ollama is NOT here: it runs natively on the host so it gets the GPU without
# WSL passthrough. Health-checked as a service by scripts/health.py all the same.
name: atelier

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: atelier
    # 5433 on the host: a natively installed PostgreSQL commonly owns 5432, and a
    # project stack should not fight the system one. In-network it is still 5432.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: init_langfuse_db
        target: /docker-entrypoint-initdb.d/10-langfuse-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes:
      - qdrant:/qdrant/storage

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://atelier:${POSTGRES_PASSWORD:?}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?}
      SALT: ${LANGFUSE_SALT:?}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports: ["127.0.0.1:5000:5000"]
    volumes:
      - mlflow:/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

configs:
  init_langfuse_db:
    content: |
      CREATE DATABASE langfuse OWNER atelier;

volumes:
  pgdata:
  qdrant:
  mlflow:
